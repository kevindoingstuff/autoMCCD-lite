# The whole stack: the api, the WHO icd-api, Postgres and Azurite.
#   docker compose -f docker/compose.yml --env-file .env up -d --build
# The api listens on the loopback interface only. icd-api, Postgres and
# Azurite are published so the eval and the notebooks can reach them from the
# host; the same ports as the full autoMCCD dev stack, so stop that one first.
name: automccd-lite

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: automccd-lite-api:local
    env_file:
      - ../.env
    environment:
      ICD_API_URL: http://icd-api:80
      PGHOST: postgres
      PGPORT: "5432"
      API_PORT: "8000"   # inside the container; the host port is the published one below
      # Azurite's published development account; not a secret.
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
    volumes:
      - ../data:/app/data   # the autocode cache the api writes stays on the host
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: unless-stopped
    depends_on:
      icd-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      azurite:
        condition: service_started

  icd-api:
    # config/default.yaml code.icd_release must match the release this image serves (2026-01)
    image: whoicd/icd-api@sha256:1b77eb6dc43e0c65a12e9e9340ad178493c93488e728d0d936507cc57ada1b7c
    environment:
      acceptLicense: "true"
      enableDoris: "true"
    restart: unless-stopped
    # ~40 s to load the release on start, and internet on the first start to
    # fetch it. The image is Alpine with wget (no curl); all three headers
    # are required or the API answers 400/412.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null --header='API-Version: v2' --header='Accept: application/json'
          --header='Accept-Language: en' http://127.0.0.1:80/icd/release/11/2026-01/mms
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12
    ports:
      - "${ICD_PORT:-8082}:80"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PGDATABASE:-automccd}
      POSTGRES_USER: ${PGUSER:-automccd}
      POSTGRES_PASSWORD: ${PGPASSWORD:-automccd}
    ports:
      - "${PGPORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-automccd} -d ${PGDATABASE:-automccd}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck --loose
    ports:
      - "10000:10000"
    volumes:
      - azurite:/data

volumes:
  pgdata:
  azurite:
