# Pipeline settings, one section per step that has any. Decide has none.
# Secrets and endpoints come from .env, never from here.

draft:
  prompt_version: "4.7"     # prompts/mccd/v<version>.md
  schema: "mccd"            # prompts/schemas/<schema>.schema.json
  model: "gpt-5-nano-2025-08-07"   # LLM_MODEL in .env overrides
  temperature: null         # reasoning models reject anything but the default
  seed: 20251023            # best effort; not deterministic on this model
  reasoning_effort: minimal # minimal = 0 reasoning tokens, ~3 s; low = ~1500, ~12 s
  max_completion_tokens: 8000  # must cover hidden reasoning; 2000 returned nothing
  timeout_s: 120
  max_retries: 4            # SDK retries on 429 / 5xx

check:
  fix_rules_attempts: 1     # model calls to fix broken rules; 0 turns the fix off
  fix_terms_attempts: 1     # model calls to restate weakly coded terms; 0 turns it off
  min_match_score: 0.5      # an autocode match below this is weak: fix_terms, who:low_match
  icd_release: "2026-01"    # must match the release the icd-api image serves
  linearization: "mms"
  timeout_s: 30
  max_retries: 2
